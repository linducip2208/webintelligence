<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Intelligence Platform</title>
<link href="/static/vendor/tabler/tabler.min.css" rel="stylesheet">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem}
.card .v{font-size:1.6rem;font-weight:700}
.empty{padding:1.5rem;text-align:center;color:var(--tblr-muted)}
.status{font-size:.72rem;padding:.15rem .6rem;border-radius:99px;background:var(--tblr-border-color);white-space:nowrap}
.ok{background:#0f3d26;color:#fff}.err{background:#4a1620;color:#fff}.warn{background:#4a3416;color:#fff}
form.inline{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
form.inline input,form.inline select{max-width:220px}
#toasts{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:1050}
.toast{background:var(--tblr-bg-surface);border:1px solid var(--tblr-border-color);border-radius:.6rem;padding:.6rem .9rem;font-size:.85rem;max-width:340px}
.navbar-vertical .nav-link{cursor:pointer}
.navbar-vertical .nav-link.active{background:var(--tblr-active-bg,#1b2942)}
pre{white-space:pre-wrap}
@media(max-width:991px){.navbar-vertical{display:none}}
</style>
</head>
<body>
<div class="page">
<aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
<div class="container-fluid">
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu">☰</button>
<h1 class="navbar-brand">Universal Intel</h1>
<div class="navbar-text text-muted small">v2.11 · live data only</div>
<div class="d-flex gap-2 my-2">
<select id="lang" class="form-select form-select-sm" onchange="setLang(this.value)"><option value="en">English</option><option value="id">Indonesia</option></select>
<button class="btn btn-icon btn-sm" onclick="toggleTheme()" title="dark/light">◐</button>
</div>
<div class="collapse navbar-collapse" id="sidebar-menu"><div id="nav" class="w-100"></div></div>
<div class="mt-2"><input id="tok" class="form-control form-control-sm" placeholder="API token / key"></div>
</div>
</aside>
<div class="page-wrapper">
<div class="page-header d-print-none"><div class="container-xl">
<div class="row g-2 align-items-center">
<div class="col"><h2 class="page-title" id="title">Dashboard</h2><div id="sub" class="text-muted small"></div></div>
<div class="col-auto ms-auto d-print-none"><div class="btn-list">
<button class="btn" onclick="load()">Refresh</button><a class="btn" href="/docs" target="_blank">📖 Docs</a><span id="actions"></span>
</div></div>
</div></div></div>
<div class="page-body"><div class="container-xl">
<div id="content"><div class="empty">Loading…</div></div>
</div></div>
</div>
</div>
<div id="toasts"></div>
<script src="/static/vendor/tabler/tabler.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let view='dashboard', LANG=localStorage.getItem('wi-lang')||'en', I18N={};
document.documentElement.dataset.bsTheme=localStorage.getItem('wi-theme')||'dark';
function toggleTheme(){const t=document.documentElement.dataset.bsTheme==='light'?'dark':'light';document.documentElement.dataset.bsTheme=t;localStorage.setItem('wi-theme',t);}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),4000);}
const NAV=[
 ['Overview',[['dashboard','dashboard']]],
 ['Collect',[['sources','projects'],['targets','targets'],['connectors','connectors'],['jobs','jobs'],['schedules','schedules'],['documents','documents']]],
 ['Process',[['products','prices'],['articles','articles'],['reviews','reviews'],['changes','changes']]],
 ['Knowledge',[['companies','entities'],['domains','entities'],['locations','entities'],['graph','graph'],['relationships','graph'],['events','events']]],
 ['Evidence',[['evidence','evidence'],['claims','claims'],['findings','findings']]],
 ['Intelligence',[['feed','feed'],['research','research'],['runs','runs'],['reports','reports'],['trends','analytics'],['anomalies','analytics'],['opportunities','opps']]],
 ['Act',[['watchlists','watchlists'],['alerts','alerts'],['workflows','workflows'],['webhooks','webhooks'],['datasets','datasets']]],
 ['AI',[['providers','ai'],['models','ai'],['usage','ai']]],
 ['System',[['health','health'],['reliability','reliability'],['quality','analytics'],['costs','costs'],['search','search'],['organizations','orgs'],['users','orgs'],['apikeys','apikeys'],['audit','audit']]],
];
function T(k){return (I18N[k]||k)}
async function init(){try{const r=await fetch('/api/v1/i18n?lang='+LANG);const j=await r.json();I18N=j.strings||{};}catch(e){}$('#lang').value=LANG;load();}
function setLang(v){LANG=v;localStorage.setItem('wi-lang',v);init();}
function nav(){$('#nav').innerHTML='<ul class="navbar-nav">'+NAV.map(([s,items])=>`<li class="nav-item"><div class="px-3 pt-3 pb-1 text-muted small text-uppercase">${T(s.toLowerCase())}</div></li>`+items.map(([label,v])=>`<li class="nav-item"><a href="#" data-v="${v}" data-l="${label}" class="nav-link ${v===view?'active':''}"><span class="nav-link-title">${T(label)}</span></a></li>`).join('')).join('')+'</ul>';
document.querySelectorAll('#nav a').forEach(a=>a.onclick=e=>{e.preventDefault();view=a.dataset.v;load()});}
function H(){const t=$('#tok').value.trim();if(!t)return{'Content-Type':'application/json'};
return t.startsWith('wi_')?{'X-API-Key':t,'Content-Type':'application/json'}:{'Authorization':'Bearer '+t,'Content-Type':'application/json'};}
async function api(p,o={}){o.headers={...H(),...(o.headers||{})};const r=await fetch(p,o);if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,300));const t=await r.text();try{return JSON.parse(t)}catch{return t}}
async function post(p,b){return api(p,{method:'POST',body:JSON.stringify(b)})}
function esc(s){return String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])).slice(0,300)}
function table(rows,cols,extra=''){if(!rows.length)return '<div class="empty">No records yet — create data via the forms or API. Empty states are real.</div>';
return `<div class="table-responsive"><table class="table table-vcenter"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}${extra?'<th></th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])}</td>`).join('')}${extra?`<td class="text-nowrap">${extra.replaceAll('{id}',r.id).replaceAll('{job_id}',r.job_id||'')}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function form(fields,fn){return `<form class="d-flex flex-wrap gap-2 my-2" onsubmit="${fn}(event)">${fields.map(f=>`<input name="${f[0]}" class="form-control" style="max-width:220px" placeholder="${f[1]}">`).join('')}<button class="btn btn-primary">Add</button></form>`}
const val=n=>{const e=document.querySelector(`[name="${n}"]`);return e?e.value:''};
async function load(){nav();$('#title').textContent=T(view);$('#actions').innerHTML='';const C=$('#content');
try{
if(view==='dashboard'){const [d,f,h,op,runs,ai,q]=await Promise.all([
api('/api/v1/dashboard'),api('/api/v1/feed?limit=5'),api('/readyz'),
api('/api/v1/opportunities'),api('/api/v1/research/runs?size=5'),
api('/api/v1/ai/usage'),api('/api/v1/analytics/quality')]);
const down=h.checks.filter(c=>c.status!=='up');
C.innerHTML=`<div class="grid">
<div class="card"><div class="card-body"><div class="subheader">Jobs</div><div class="v">${d.jobs_total}</div><div class="text-muted">${d.jobs_success} ok / ${d.jobs_failed} failed</div></div></div>
<div class="card"><div class="card-body"><div class="subheader">Open alerts</div><div class="v">${d.alerts_open}</div></div></div>
<div class="card"><div class="card-body"><div class="subheader">Price points</div><div class="v">${d.price_points}</div></div></div>
<div class="card"><div class="card-body"><div class="subheader">Est. cost</div><div class="v">$${(d.costs.estimated||0).toFixed(4)}</div></div></div>
<div class="card"><div class="card-body"><div class="subheader">Opportunities</div><div class="v">${(op.items||[]).length}</div></div></div>
<div class="card"><div class="card-body"><div class="subheader">Data quality</div><div class="v">${q.avg_overall??'—'}</div><div class="text-muted">${q.records} records</div></div></div>
<div class="card"><div class="card-body"><div class="subheader">AI calls</div><div class="v">${ai.calls}</div><div class="text-muted">$${(ai.cost||0).toFixed(4)}</div></div></div>
<div class="card"><div class="card-body"><div class="subheader">System</div><div class="v"><span class="status ${h.status==='healthy'?'ok':'warn'}">${h.status}</span></div><div class="text-muted">${down.length?('down: '+down.map(c=>c.name).join(', ')):'all dependencies up'}</div></div></div></div>
<div class="grid"><div class="card"><div class="card-body"><h3 class="card-title">${T('feed')}</h3>${f.items.map(i=>`<div>• [${esc(i.kind)}] ${esc(i.title)}</div>`).join('')||'<div class="empty">Feed empty — run collections to generate intelligence.</div>'}</div></div>
<div class="card"><div class="card-body"><h3 class="card-title">${T('runs')}</h3>${(runs.items||[]).map(r=>`<div>• #${r.id} ${esc((r.question||'').slice(0,60))} [${r.status}]</div>`).join('')||'<div class="empty">No research yet.</div>'}</div></div></div>
${d.jobs_total===0?'<div class="empty">Follow the data flow in the sidebar: <b>1 · Collect</b> (sources → targets → jobs → Run now) → <b>2 · Process</b> → <b>3 · Knowledge</b> → <b>4 · Evidence</b> → <b>5 · Intelligence</b> → <b>6 · Act</b>. Numbers appear only from real runs.</div>':''}`;}
else if(view==='feed'){const d=await api('/api/v1/feed?limit=50');C.innerHTML=d.items.map(i=>`<div class="card"><div class="card-body"><h3 class="card-title">[${esc(i.kind)}] ${esc(i.title)}</h3><div class="text-muted">${esc(JSON.stringify(i.ref))}</div></div></div>`).join('')||'<div class="empty">No feed items.</div>';}
else if(view==='opps'){const d=await api('/api/v1/opportunities');C.innerHTML=table(d.items||[],['type','product_id','price','z']);}
else if(view==='research'){C.innerHTML=`<div class="card"><div class="card-body"><h3 class="card-title">New research</h3><form class="d-flex flex-wrap gap-2" onsubmit="mkResearch(event)"><input name="q" class="form-control" style="max-width:340px" placeholder="Research question…"><button class="btn btn-primary">Plan</button></form><pre id="rp"></pre><pre id="rr"></pre></div></div>`;}
else if(view==='runs'){const d=await api('/api/v1/research/runs');C.innerHTML=table(d.items||[],['id','question','status','ai_model']);}
else if(view==='graph'){C.innerHTML=`<div class="card"><div class="card-body"><h3 class="card-title">Add node</h3>${form([['kind','kind: company'],['key','key'],['name','name']],'addNode')}<h3 class="card-title">Add edge</h3>${form([['src','src id'],['dst','dst id'],['rel','OWNS']],'addEdge')}<h3 class="card-title">Traverse / render (paginated subgraph)</h3><form class="d-flex flex-wrap gap-2" onsubmit="trav(event)"><input name="node" class="form-control" style="max-width:140px" placeholder="node id"><input name="rel" class="form-control" style="max-width:140px" placeholder="rel filter"><input name="kind" class="form-control" style="max-width:140px" placeholder="kind filter"><button class="btn">Go</button><button type="button" class="btn" onclick="svg()">SVG</button></form><pre id="g"></pre><div id="gv"></div></div></div>`;}
else if(view==='reviews'){const s=await api('/api/v1/reviews/summary');C.innerHTML=`<div class="grid"><div class="card"><div class="card-body"><div class="subheader">Reviews</div><div class="v">${s.count}</div><div class="text-muted">avg ${s.avg_rating??'—'}</div></div></div><div class="card"><div class="card-body"><div class="subheader">Sentiment</div><pre>${esc(JSON.stringify(s.sentiment))}</pre></div></div></div>`;}
else if(view==='events'){const d=await api('/api/v1/events?size=50');C.innerHTML=form([['type','type: PRICE'],['entity_key','entity key']],'addEvent')+table(d.items||[],['id','type','entity_key','severity']);}
else if(view==='evidence'){const d=await api('/api/v1/evidence?size=50');C.innerHTML=form([['source','source'],['url','https://…'],['content_hash','hash']],'addEvidence')+table(d.items||[],['id','source','url','content_hash','confidence']);}
else if(view==='claims'){C.innerHTML=`<div class="card"><div class="card-body"><h3 class="card-title">Verify a claim against evidence</h3><form class="d-flex flex-wrap gap-2" onsubmit="verifyCl(event)"><input name="value" class="form-control" style="max-width:160px" placeholder="claim value"><input name="ev" class="form-control" style="max-width:340px" placeholder='evidence JSON'><button class="btn btn-primary">Verify</button></form><pre id="vc"></pre></div></div>`;}
else if(view==='documents'){const d=await api('/api/v1/documents');C.innerHTML=`<div class="card"><div class="card-body"><h3 class="card-title">Ingest document (txt/html/csv; pdf needs pypdf)</h3><form class="d-flex flex-wrap gap-2" onsubmit="addDoc(event)"><input name="kind" class="form-control" style="max-width:120px" placeholder="txt"><input name="title" class="form-control" style="max-width:200px" placeholder="title"><input name="text" class="form-control" style="max-width:300px" placeholder="text content…"><button class="btn btn-primary">Ingest</button></form></div></div>`+table(d.items||[],['id','kind','title','fingerprint','extracted']);}
else if(view==='datasets'){const d=await api('/api/v1/datasets');C.innerHTML=form([['name','name'],['kind','kind']],'addDataset')+table(d.items||[],['id','name','kind','status']);}
else if(view==='watchlists'){const d=await api('/api/v1/watchlists');C.innerHTML=form([['kind','keyword|company|domain'],['value','value']],'addWl')+table(d.items||[],['id','kind','value'],'<button class="btn btn-sm" onclick="evalWl({id})">Evaluate</button>');}
else if(view==='workflows'){const d=await api('/api/v1/workflows');C.innerHTML=`<div class="card"><div class="card-body"><h3 class="card-title">New workflow (alert on event type)</h3><form class="d-flex flex-wrap gap-2" onsubmit="addWf(event)"><input name="name" class="form-control" style="max-width:200px" placeholder="name"><input name="etype" class="form-control" style="max-width:200px" placeholder="event type"><button class="btn btn-primary">Create</button></form></div></div>`+table((d.items||[]).map(r=>({...r})),['id','name','enabled'],'<button class="btn btn-sm" onclick="runWf({id})">Run</button>');}
else if(view==='webhooks'){const d=await api('/api/v1/webhooks');$('#actions').innerHTML='';C.innerHTML=form([['url','https://…'],['secret','secret']],'addWh')+table((d.items||[]),['id','url','enabled'],'<button class="btn btn-sm" onclick="testWh({id})">Test</button>');}
else if(view==='orgs'){const d=await api('/api/v1/orgs');C.innerHTML=form([['name','org name']],'addOrg')+table(d.items||[],['id','name','slug']);}
else if(view==='apikeys'){const d=await api('/api/v1/apikeys');C.innerHTML=form([['name','name'],['scopes','read (comma ok)']],'addKey')+table(d.items||[],['id','name','scopes','revoked']);}
else if(view==='health'){const h=await api('/readyz');C.innerHTML=`<div class="grid">${h.checks.map(c=>`<div class="card"><div class="card-body"><div class="subheader">${esc(c.name)}</div><div class="v"><span class="status ${c.status==='up'?'ok':'err'}">${c.status}</span></div><div class="text-muted">${esc(c.detail||'')}</div></div></div>`).join('')}</div>`;}
else if(view==='ai'){await aiProvidersView(C);}
else if(view==='search'){C.innerHTML=`<form class="d-flex flex-wrap gap-2" onsubmit="doSearch(event)"><input name="q" class="form-control" style="max-width:320px"><button class="btn btn-primary">Search</button></form><div id="res"></div>`;}
else if(view==='jobs'){const d=await api('/api/v1/jobs?size=50');C.innerHTML=form([['project_id','project_id'],['target_id','target_id'],['url','https://…']],'addJob')+table(d.items||[],['job_id','url','strategy','status','estimated_cost'],'<button class="btn btn-sm" onclick="runJob(\'{job_id}\')">Run now</button>');}
else if(view==='schedules'){$('#actions').innerHTML='<button class="btn" onclick="tick()">Run scheduler now</button>';const d=await api('/api/v1/schedules');C.innerHTML=form([['kind','interval|cron'],['every_min','every_min'],['cron','cron expr'],['url','https://…']],'addSched')+table(d.items||[],['id','kind','url','status','next_run','last_run']);}
else if(view==='reports'){$('#actions').innerHTML='';const d=await api('/api/v1/reports');C.innerHTML=form([['kind','price'],['product_id','product/target id'],['project','project']],'addReport')+table(d.items||[],['id','kind','project','generated_at','source_coverage'],'<button class="btn btn-sm" onclick="viewReport({id})">View</button>');}
else if(view==='analytics'){const p=await api('/api/v1/analytics/prices');const t=await api('/api/v1/analytics/trends');const q=await api('/api/v1/analytics/quality');
C.innerHTML=`<div class="grid"><div class="card"><div class="card-body"><div class="subheader">Prices</div><div class="v">${p.count}</div><div class="text-muted">avg ${p.avg??'—'} · vol ${p.volatility}</div></div></div><div class="card"><div class="card-body"><div class="subheader">Anomalies</div><div class="v">${(p.anomalies||[]).length}</div></div></div><div class="card"><div class="card-body"><div class="subheader">Quality</div><div class="v">${q.avg_overall??'—'}</div></div></div></div><div class="card"><div class="card-body"><h3 class="card-title">Topics</h3><pre>${esc(JSON.stringify(t.topics))}</pre></div></div>`;}
else if(view==='costs'){const s=await api('/api/v1/costs/summary');C.innerHTML=`<div class="grid"><div class="card"><div class="card-body"><div class="subheader">Estimated</div><div class="v">$${(s.estimated||0).toFixed(4)}</div></div></div><div class="card"><div class="card-body"><div class="subheader">Actual</div><div class="v">$${(s.actual||0).toFixed(4)}</div></div></div><div class="card"><div class="card-body"><div class="subheader">Per 1k</div><div class="v">$${s.per_1k??'—'}</div></div></div></div><form class="d-flex flex-wrap gap-2" onsubmit="setBudget(event)"><input name="limit" class="form-control" style="max-width:200px" placeholder="budget limit"><button class="btn btn-primary">Set budget p1</button></form>`;}
else if(view==='entities'){const d=await api('/api/v1/entities');C.innerHTML=`<div class="card"><div class="card-body"><h3 class="card-title">Resolve</h3><form class="d-flex flex-wrap gap-2" onsubmit="resolveE(event)"><input name="name" class="form-control" style="max-width:200px"><input name="domain" class="form-control" style="max-width:200px"><button class="btn btn-primary">Resolve</button></form><pre id="er"></pre></div></div>`+table((d.items||[]).map(r=>({...r,hist:`<button class="btn btn-sm" onclick="entHist()">History</button>`})),['id','name','domain'],'<button class="btn btn-sm" onclick="entDetail({id})">Open</button>');}
else if(view==='entity'){const id=new URLSearchParams(location.hash.slice(1)).get('id')||'1';const d=await api('/api/v1/entities/'+id);
C.innerHTML=`<div class="card"><div class="card-body"><h3 class="card-title">${esc(d.entity.name)} (${esc(d.entity.kind||'entity')})</h3><pre>${esc(JSON.stringify(d.entity,null,2))}</pre></div></div>
<div class="grid"><div class="card"><div class="card-body"><div class="subheader">Timeline</div><pre>${esc(JSON.stringify(d.timeline))}</pre></div></div>
<div class="card"><div class="card-body"><div class="subheader">Relationships (${d.relationships.length})</div><pre>${esc(JSON.stringify(d.relationships.map(r=>r.rel)).slice(0,500))}</pre></div></div>
<div class="card"><div class="card-body"><div class="subheader">Events (${d.events.length})</div></div></div><div class="card"><div class="card-body"><div class="subheader">Evidence (${d.evidence.length})</div></div></div></div>`;}
else if(view==='finding'){const id=new URLSearchParams(location.hash.slice(1)).get('id')||'1';const d=await api('/api/v1/findings/'+id);
C.innerHTML=`<div class="card"><div class="card-body"><h3 class="card-title">${esc(d.finding.title)}</h3><div>${esc(d.finding.body||'')}</div><div class="text-muted">${esc(d.why)}</div></div></div>
<div class="card"><div class="card-body"><h3 class="card-title">Evidence (${d.evidence.length})</h3><pre>${esc(JSON.stringify(d.evidence.map(e=>[e.source,e.url,e.content_hash]),null,1)).slice(0,2000)}</pre></div></div>
<div class="card"><div class="card-body"><h3 class="card-title">Related events (${d.related_events.length})</h3></div></div>`;}
else if(view==='reliability'){const d=await api('/api/v1/reliability/targets');C.innerHTML=d.score===null?'<div class="empty">No collection history yet — reliability appears after real runs.</div>':`<div class="grid"><div class="card"><div class="card-body"><div class="subheader">Score</div><div class="v">${d.score}</div></div></div><div class="card"><div class="card-body"><div class="subheader">Success rate</div><div class="v">${d.success_rate}</div><div class="text-muted">${d.attempts} attempts</div></div></div><div class="card"><div class="card-body"><div class="subheader">Avg latency</div><div class="v">${d.avg_latency_ms}ms</div></div></div><div class="card"><div class="card-body"><div class="subheader">Stability</div><div class="v">${d.stability}</div></div></div></div>`;}
else if(view==='connectors'){const d=await api('/api/v1/connectors');C.innerHTML=table(d.items||[],['id','name','category','version','enabled']);}
else if(view==='audit'){const d=await api('/api/v1/audit');C.innerHTML=table(d.items||[],['actor','action','ref']);}
else if(view==='articles'){const d=await api('/api/v1/articles');C.innerHTML=form([['publisher','publisher'],['title','title'],['url','url']],'addArticle')+table(d.items||[],['id','publisher','title']);}
else if(view==='alerts'){const d=await api('/api/v1/alerts');C.innerHTML=table(d.items||[],['id','rule','message','channel'],'<button class="btn btn-sm" onclick="sendAlert({id})">Send</button>');}
else if(view==='prices'){const d=await api('/api/v1/prices?size=50');C.innerHTML=table(d.items||[],['product_id','price','currency','job_id']);}
else if(view==='changes'){const d=await api('/api/v1/changes?size=50');C.innerHTML=table(d.items||[],['target_id','kind']);}
else{const ep={projects:'/api/v1/projects',targets:'/api/v1/targets',findings:'/api/v1/findings'}[view];const d=await api(ep);const rows=(d.items||[]).map(r=>({...r}));const xb=view==='findings'?'<button class="btn btn-sm" onclick="openFinding({id})">Open</button>':(view==='targets'?'<button class="btn btn-sm" onclick="testTarget({id})">Test</button>':'');C.innerHTML=(view==='targets'?form([['project_id','project_id=1'],['domain','domain'],['url','https://…']],'addTarget'):'')+table(rows,Object.keys((d.items||[{}])[0]).slice(0,5),xb);}

async function aiProvidersView(C){
let presets=[],db=[],envP={providers:[]},envH={ok:false};
try{presets=(await api('/api/v1/ai/provider-presets')).presets||[]}catch(e){}
try{db=(await api('/api/v1/ai/providers/db')).items||[]}catch(e){}
try{envP=await api('/api/v1/ai/providers')}catch(e){}
try{envH=await api('/api/v1/ai/health')}catch(e){}
window._aiPresets=presets;
const envCfg=envH.reason!=='not-configured';
const badge=p=>{
if(!p.enabled)return '<span class="status">Disabled</span>';
if(p.last_test_status==='passed')return '<span class="status ok">● Connected</span>';
if(p.last_test_status==='failed')return '<span class="status err">● Connection failed</span>';
return '<span class="status">● Not tested</span>'};
const tested=p=>p.last_tested_at?new Date(p.last_tested_at*1000).toLocaleString():'—';
const lat=p=>(p.last_test_latency_ms!=null&&p.last_tested_at)?p.last_test_latency_ms+' ms':'—';
const cards=db.map(p=>`<div class="card"><div class="card-body">
<div class="d-flex align-items-center gap-2 flex-wrap"><h3 class="card-title m-0">${esc(p.name)}</h3>${badge(p)}<span class="text-muted small">${esc(p.preset||p.protocol||'')}</span></div>
<div class="text-muted small mt-1">Model: <b>${esc(p.model||'—')}</b> · Protocol: ${esc(p.protocol||'chat')}</div>
<div class="text-muted small">Last tested: ${tested(p)}${p.last_tested_at?' · Latency: '+lat(p):''}${p.last_test_status==='failed'&&p.last_test_error?' · <span class="text-danger">'+esc(p.last_test_error)+'</span>':''}</div>
<div class="btn-list mt-2"><button class="btn btn-sm" id="t${p.id}" onclick="aiRowTest(${p.id})">Test connection</button><button class="btn btn-sm" onclick="aiEditOpen(${p.id})">Edit</button><button class="btn btn-sm btn-danger" onclick="aiDelete(${p.id},'${esc(p.name).replace(/'/g,"\\'")}')">Delete</button><button class="btn btn-sm" onclick="aiToggle(${p.id},${p.enabled?0:1})">${p.enabled?'Disable':'Enable'}</button></div>
</div></div>`).join('');
const envCard=envCfg?`<div class="card"><div class="card-body"><div class="d-flex align-items-center gap-2"><h3 class="card-title m-0">Muse Spark <span class="text-muted small">(environment)</span></h3>${envH.ok?'<span class="status ok">● Connected</span>':'<span class="status err">● Connection failed</span>'}</div><div class="text-muted small mt-1">Model: <b>${esc((envP.models||[])[0]||'—')}</b> · Read-only, managed via server environment.</div></div></div>`:'';
C.innerHTML=`<div class="d-flex align-items-center flex-wrap gap-2 mb-3"><div><h2 class="m-0">AI Providers</h2><div class="text-muted small">Manage configured AI providers, credentials, connection status, and models. App API keys are managed separately under Administration → apikeys.</div></div><div class="ms-auto"><button class="btn btn-primary" onclick="aiWizardOpen()">+ Add AI provider</button></div></div>
<div class="grid">${envCard}${cards}</div>
${(!db.length&&!envCfg)?'<div class="card"><div class="card-body"><div class="empty"><h3>No AI providers configured.</h3><p>Add an AI provider to enable AI-powered features.</p><button class="btn btn-primary" onclick="aiWizardOpen()">+ Add AI provider</button></div></div></div>':''}
<div class="card"><div class="card-body"><h3 class="card-title">Ask (evidence-grounded)</h3><form class="d-flex flex-wrap gap-2" onsubmit="chat(event)"><input name="q" class="form-control" style="max-width:320px" aria-label="question"><button class="btn btn-primary">Send</button></form><pre id="ans"></pre></div></div>
<div id="ai-modal"></div>`;
}
function aiModal(html){const m=$('#ai-modal');m.innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:2rem 1rem" onclick="if(event.target===this)aiModalClose()"><div class="card" style="width:100%;max-width:640px" role="dialog" aria-modal="true"><div class="card-body">${html}</div></div></div>`;const f=m.querySelector('input,select,button');if(f)f.focus();}
function aiModalClose(){const m=$('#ai-modal');if(m)m.innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')aiModalClose()});
let WIZ=null;
function aiWizardOpen(){WIZ={step:1,preset:null,name:'',endpoint:'',key:'',model:'',models:[],manual:false,tested:false,testing:false,result:null};aiWizardRender();}
function aiWizardRender(){const P=window._aiPresets||[];
if(WIZ.step===1){aiModal(`<h3>Select AI provider</h3><p class="text-muted">Choose a provider to configure. Only connection details you enter are used.</p><div class="grid">${P.map(p=>`<button id="preset-${p.id}" class="card text-start" style="cursor:pointer;text-align:left" onclick="aiWizardPick('${p.id}')"><div class="card-body"><b>${esc(p.display_name)}</b><div class="text-muted small">${esc(p.description)}</div><div class="text-muted small mt-1">Auth: ${esc(p.auth==='optional_key'?'optional key':'API key')} · Protocol: ${esc(p.protocol)}</div></div></button>`).join('')}</div><div class="mt-2"><button class="btn" onclick="aiModalClose()">Cancel</button></div>`);return;}
const pr=WIZ.preset,ro=pr.endpoint_mode==='fixed',needEp=pr.endpoint_mode!=='fixed';
const modelBox=WIZ.models.length?`<label class="form-label">Model</label><select id="wmodel" class="form-select" aria-label="model">${WIZ.models.map(m=>`<option ${m.id===WIZ.model?'selected':''}>${esc(m.id)}</option>`).join('')}</select>`:`<label class="form-label">Model</label><input id="wmodel" class="form-control" value="${esc(WIZ.model)}" placeholder="${pr.discovery?'Discover via Test connection':'Type model id'}" aria-label="model">${WIZ.manual?'<div class="text-muted small mt-1">Model discovery is not supported by this provider — type the model id.</div>':''}`;
aiModal(`<h3>${esc(pr.display_name)}</h3><p class="text-muted">${esc(pr.description)}</p>
<label class="form-label">Configuration name</label><input id="wname" class="form-control" value="${esc(WIZ.name||pr.display_name)}" aria-label="configuration name">
${needEp?`<label class="form-label mt-2">Endpoint</label><input id="wep" class="form-control" value="${esc(WIZ.endpoint||pr.default_endpoint)}" ${ro?'readonly':''} aria-label="endpoint">`:''}
<label class="form-label mt-2">${esc(pr.key_label)}</label><input id="wkey" type="password" class="form-control" value="" placeholder="${pr.key_required?'(required)':'(optional)'}" autocomplete="new-password" aria-label="api key">
<div class="mt-2">${modelBox}</div>
<details class="mt-2"><summary class="text-muted">Advanced settings</summary><div class="text-muted small mt-1">Protocol: <b>${esc(pr.protocol)}</b> · Model discovery: <b>${pr.discovery?'supported':'manual entry'}</b> · Credentials are encrypted server-side and never shown again.</div></details>
<div id="wres" class="mt-2">${WIZ.result?aiTestResultHtml(WIZ.result):''}</div>
<div class="btn-list mt-3"><button class="btn" id="wtest" onclick="aiWizardTest()" ${WIZ.testing?'disabled':''}>${WIZ.testing?'<span class="spinner-border spinner-border-sm me-1"></span>Testing…':'Test connection'}</button><button class="btn btn-primary" onclick="aiWizardSave()" ${WIZ.tested?'':'disabled'}>Save provider</button><button class="btn" onclick="aiModalClose()">Cancel</button></div>
${WIZ.tested?'':'<div class="text-muted small mt-1">Test the connection first — saving requires a successful test.</div>'}`);}
function aiWizardPick(id){const pr=(window._aiPresets||[]).find(p=>p.id===id);if(!pr)return;WIZ.preset=pr;WIZ.step=2;WIZ.name=pr.display_name;WIZ.endpoint=pr.default_endpoint||'';WIZ.model=pr.default_model||'';WIZ.models=[];WIZ.manual=!pr.discovery;WIZ.tested=false;WIZ.result=null;aiWizardRender();}
async function aiWizardTest(){const pr=WIZ.preset;WIZ.name=$('#wname').value.trim();if(pr.endpoint_mode!=='fixed')WIZ.endpoint=$('#wep').value.trim();const k=$('#wkey').value;if(k)WIZ.key=k;const ms=$('#wmodel');if(ms)WIZ.model=ms.value.trim();
if(!WIZ.name){toast('Name required');return}
if(pr.endpoint_mode==='required'&&!WIZ.endpoint){toast('Endpoint required');return}
if(pr.key_required&&!WIZ.key){toast('API key required');return}
WIZ.testing=true;aiWizardRender();
try{const r=await post('/api/v1/ai/providers/db/test',{name:WIZ.name,preset:pr.id,protocol:pr.protocol,base_url:WIZ.endpoint||pr.default_endpoint,api_key:WIZ.key,model:WIZ.model});WIZ.result=r;WIZ.tested=!!r.success;
if(r.success&&r.models&&r.models.length){WIZ.models=r.models;if(!WIZ.model&&r.models[0])WIZ.model=r.models[0].id;}
if(r.success&&(!r.models||!r.models.length)){WIZ.manual=true;}
}catch(e){WIZ.result={success:false,error:{code:'REQUEST_FAILED',message:String(e).slice(0,200)}};WIZ.tested=false;}
WIZ.testing=false;aiWizardRender();}
function aiTestResultHtml(r){if(r.success){return `<div class="alert alert-success"><b>✓ Connection successful</b><div class="small">Provider: ${esc(r.provider.name)} · Authentication: valid · Model: ${esc(r.model.selected||'—')} (${r.model.available?'available':'unverified'}) · Latency: ${r.connection.latency_ms} ms · Models discovered: ${r.models.length}</div></div>`;}
const e=r.error||{};return `<div class="alert alert-danger"><b>✕ Connection failed</b><div class="small">${esc(e.message||'failed')}${e.code?' · HTTP/code: '+esc(e.code):''}${e.suggested_action?'<br>Suggested action: '+esc(e.suggested_action):''}</div></div>`;}
async function aiWizardSave(){const nm=$('#wname');if(nm&&nm.value.trim())WIZ.name=nm.value.trim();const wm=$('#wmodel');if(wm&&wm.value.trim())WIZ.model=wm.value.trim();try{const r=await post('/api/v1/ai/providers/db',{name:WIZ.name,preset:WIZ.preset.id,protocol:WIZ.preset.protocol,base_url:WIZ.endpoint||WIZ.preset.default_endpoint,api_key:WIZ.key,model:WIZ.model});aiModalClose();toast('Provider saved');load();}catch(e){toast('Save failed: '+String(e).slice(0,200))}}
async function aiRowTest(id){const b=$('#t'+id);if(b){b.disabled=true;b.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Testing…';}
try{const r=await post(`/api/v1/ai/providers/db/${id}/test`,{});toast(r.success?`✓ Connected (${r.connection.latency_ms} ms)`:`✕ ${((r.error||{}).message||'failed')}`)}catch(e){toast('✕ '+String(e).slice(0,200))}
load();}
async function aiToggle(id,en){await post(`/api/v1/ai/providers/db/${id}/${en?'enable':'disable'}`,{});load();}
async function aiDelete(id,name){if(!confirm(`Delete provider "${name}"? The stored credential will be removed.`))return;try{await api(`/api/v1/ai/providers/db/${id}`,{method:'DELETE'});toast('Deleted');}catch(e){toast(String(e).slice(0,200))}load();}
async function aiEditOpen(id){let p;try{p=await api(`/api/v1/ai/providers/db/${id}`)}catch(e){toast(String(e).slice(0,200));return}
window._aiEdit={id,changeKey:false,models:p.model?[p.model]:[],manual:false};
aiModal(`<h3>Edit provider</h3><label class="form-label">Provider (read-only)</label><input class="form-control" value="${esc(p.preset||p.protocol||'')}" readonly>
<label class="form-label mt-2">API key</label><div id="ekeywrap"><input class="form-control" value="••••••••••••••••" readonly><button class="btn btn-sm mt-1" onclick="aiEditKey()">Change API key</button></div>
<label class="form-label mt-2">Model</label><div class="d-flex gap-2"><select id="emodel" class="form-select" aria-label="model">${window._aiEdit.models.map(m=>`<option ${m===p.model?'selected':''}>${esc(m)}</option>`).join('')}</select><button class="btn btn-sm" id="ediscover" onclick="aiEditDiscover(${id})">Discover</button></div><div id="eres" class="text-muted small mt-1"></div>
<div class="btn-list mt-3"><button class="btn" id="etest" onclick="aiEditTest(${id})">Test connection</button><button class="btn btn-primary" onclick="aiEditSave(${id})">Save changes</button><button class="btn" onclick="aiModalClose()">Cancel</button></div><div id="esaveres" class="mt-2"></div>`);}
function aiEditKey(){window._aiEdit.changeKey=true;$('#ekeywrap').innerHTML='<input id="ekey" type="password" class="form-control" placeholder="new API key" autocomplete="new-password" aria-label="new api key">';}
async function aiEditDiscover(id){const b=$('#ediscover');b.disabled=true;b.textContent='Discovering…';try{const r=await post(`/api/v1/ai/providers/db/${id}/models`,{});const sel=$('#emodel');
if(r.models&&r.models.length){window._aiEdit.models=r.models.map(m=>m.id);sel.innerHTML=r.models.map(m=>`<option>${esc(m.id)}</option>`).join('');$('#eres').textContent=r.models.length+' models discovered';}
else{$('#eres').textContent=(r.note||((r.error||{}).message)||'Manual entry — discovery not supported');const inp=document.createElement('input');inp.id='emodel';inp.className='form-control';inp.value=sel.value;sel.replaceWith(inp);}}catch(e){$('#eres').textContent=String(e).slice(0,200)}b.disabled=false;b.textContent='Discover';}
async function aiEditTest(id){const b=$('#etest');b.disabled=true;b.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Testing…';
const body={};const m=$('#emodel');if(m)body.model=m.value.trim();const k=$('#ekey');if(k&&k.value)body.api_key=k.value;
try{if(body.model||body.api_key)await post(`/api/v1/ai/providers/db/${id}`,body);}catch(e){}
let r;try{r=await post(`/api/v1/ai/providers/db/${id}/test`,{});}catch(e){r={success:false,error:{message:String(e).slice(0,200)}}}
$('#esaveres').innerHTML=aiTestResultHtml(r);b.disabled=false;b.textContent='Test connection';}
async function aiEditSave(id){const body={};const m=$('#emodel');if(m)body.model=m.value.trim();const k=$('#ekey');if(k&&k.value)body.api_key=k.value;
try{await post(`/api/v1/ai/providers/db/${id}`,body);aiModalClose();toast('Saved');load();}catch(e){toast('Save failed: '+String(e).slice(0,200))}}
async function mkResearch(e){e.preventDefault();const p=await post('/api/v1/research/plan',{question:val('q')});document.querySelector('#rp').textContent=JSON.stringify(p,null,2).slice(0,2000);const r=await post('/api/v1/research/runs',{question:val('q'),plan:p});document.querySelector('#rr').textContent='run #'+r.id+' planned — collect evidence, then finish via API';}
init();
</script>
</body>
