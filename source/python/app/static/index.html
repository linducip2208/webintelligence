<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Intelligence Platform</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;background:#0b1220;color:#e6edf3}
.layout{display:flex;min-height:100vh}aside{width:230px;background:#0d1526;padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:16px;margin:0 0 12px}aside a{display:block;color:#c9d4e3;text-decoration:none;padding:8px 10px;border-radius:8px}
aside a:hover,aside a.active{background:#1b2942}main{flex:1;padding:20px;max-width:1200px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#111c33;border:1px solid #22314f;border-radius:12px;padding:14px}
.card h3{margin:0 0 6px;font-size:13px;color:#9fb0c9}.card .v{font-size:24px;font-weight:700}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #22314f;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select,button{background:#0d1526;border:1px solid #2a3c5e;color:#e6edf3;border-radius:8px;padding:8px 10px}
button{cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}.empty{padding:24px;text-align:center;color:#9fb0c9}
.status{font-size:12px;padding:2px 8px;border-radius:99px;background:#1b2942}.ok{background:#0f3d26}.err{background:#4a1620}
@media(max-width:800px){aside{display:none}}
</style>
</head>
<body>
<div class="layout">
<aside>
<h1>Web Intelligence</h1>
<a href="#" data-view="dashboard" class="active">Dashboard</a>
<a href="#" data-view="projects">Projects</a>
<a href="#" data-view="targets">Targets</a>
<a href="#" data-view="jobs">Collection Jobs</a>
<a href="#" data-view="proxies">Proxies &amp; Bright Data</a>
<a href="#" data-view="ai">AI Providers</a>
<a href="#" data-view="alerts">Alerts</a>
<a href="#" data-view="health">System Health</a>
</aside>
<main>
<header><div><strong id="title">Dashboard</strong><div id="sub" style="color:#9fb0c9;font-size:13px">live data — no placeholders</div></div>
<div><button onclick="load()">Refresh</button> <button class="primary" onclick="showJob()">+ New job</button></div></header>
<div id="content"><div class="empty">Loading…</div></div>
</main>
</div>
<script>
const $=s=>document.querySelector(s);let view='dashboard';
async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){
 document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('active',a.dataset.view===view));
 $('#title').textContent=view[0].toUpperCase()+view.slice(1);
 try{
 if(view==='dashboard'){const d=await api('/api/v1/dashboard');
  $('#content').innerHTML=`<div class="grid">
  <div class="card"><h3>Jobs total</h3><div class="v">${d.jobs_total}</div></div>
  <div class="card"><h3>Success</h3><div class="v">${d.jobs_success}</div></div>
  <div class="card"><h3>Failed</h3><div class="v">${d.jobs_failed}</div></div>
  <div class="card"><h3>Open alerts</h3><div class="v">${d.alerts_open}</div></div>
  <div class="card"><h3>Price points</h3><div class="v">${d.price_points}</div></div>
  <div class="card"><h3>Est. cost</h3><div class="v">$${(d.costs.estimated||0).toFixed(4)}</div></div></div>
  ${d.jobs_total===0?'<div class="empty">No collection jobs yet — create a project, a target, then a job. Metrics appear here only from real runs.</div>':''}`;}
 else if(view==='health'){const h=await api('/readyz');$('#content').innerHTML='<div class="grid">'+h.checks.map(c=>`<div class="card"><h3>${c.name}</h3><div class="v"><span class="status ${c.status==='up'?'ok':'err'}">${c.status}</span></div><div>${c.detail||''}</div></div>`).join('')+'</div>';}
 else if(view==='proxies'){const h=await api('/api/v1/proxies/health');$('#content').innerHTML=`<div class="grid"><div class="card"><h3>Own proxy</h3><pre>${JSON.stringify(h.own,null,2)}</pre></div><div class="card"><h3>Bright Data</h3><pre>${JSON.stringify(h.brightdata,null,2)}</pre><button onclick="testBD()">Test connection</button><pre id="bd"></pre></div></div>`;}
 else if(view==='ai'){const h=await api('/api/v1/ai/providers');const s=await api('/api/v1/ai/health');$('#content').innerHTML=`<div class="card"><h3>Providers</h3><pre>${JSON.stringify(h,null,2)}</pre><h3>Health</h3><pre>${JSON.stringify(s,null,2)}</pre></div>`;}
 else{const map={projects:'/api/v1/projects',targets:'/api/v1/targets',jobs:'/api/v1/jobs',alerts:'/api/v1/alerts'};const d=await api(map[view]);const rows=(d.items||[]).map(r=>`<tr>${Object.values(r).slice(0,5).map(v=>`<td>${String(v).slice(0,80)}</td>`).join('')}</tr>`).join('');$('#content').innerHTML=`<div class="toolbar"><input id="q" placeholder="Search…" oninput="load()"></div><table><tbody>${rows||''}</tbody></table>${rows?'':'<div class="empty">Nothing here yet. Create records via the API — empty states are real, not errors.</div>'}`;}
 }catch(e){$('#content').innerHTML=`<div class="empty">Error: ${String(e).slice(0,500)}</div>`}
}
async function testBD(){try{const r=await api('/api/v1/brightdata/test',{method:'POST'});document.querySelector('#bd').textContent=JSON.stringify(r,null,2)}catch(e){document.querySelector('#bd').textContent=String(e)}}
async function showJob(){const url=prompt('Target URL (public, http/https):');if(!url)return;try{const r=await api('/api/v1/jobs',{method:'POST',body:JSON.stringify({project_id:1,target_id:1,url,strategy:'AUTO'})});alert('Queued: '+r.job_id+' plan='+(r.plan.plan||[]).join('→'))}catch(e){alert('Rejected: '+e)}}
document.querySelectorAll('aside a').forEach(a=>a.onclick=e=>{e.preventDefault();view=a.dataset.view;load()});
load();
</script>
</body>
</html>
