/* Pre-paint theme + sidebar init: no flash. light default, dark + system supported. */
(function(){try{
var t=localStorage.getItem('wi-theme')||'light';
var eff=t==='system'?((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'):t;
document.documentElement.setAttribute('data-bs-theme',eff);
document.documentElement.setAttribute('data-wi-theme',t);
var s=localStorage.getItem('wi-side')||'expanded';
if(s==='folded')document.documentElement.setAttribute('data-wi-side','folded');
if((localStorage.getItem('wi-nav')||'sticky')==='static')document.documentElement.setAttribute('data-wi-nav','static');
var ac=localStorage.getItem('wi-accent')||'blue';
if(ac!=='blue')document.documentElement.setAttribute('data-accent',ac);
}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}})();
</script>

<style>
/* ---- Web Intelligence design tokens (Tabler variables first) ---- */
:root{
--wi-primary:#206bc4;--wi-radius:.6rem;--wi-on-primary:#fff;
--wi-surface:var(--tblr-bg-surface);--wi-surface-2:var(--tblr-bg-surface-secondary);
--wi-border:var(--tblr-border-color);--wi-text:var(--tblr-body-color);--wi-muted:var(--tblr-muted);
--wi-ok:#2fb344;--wi-warn:#e79b13;--wi-err:#d63939;--wi-info:#206bc4;
--wi-side-w:16rem;--wi-side-fold:4.25rem;
--wi-shadow:0 .125rem .5rem rgba(0,0,0,.06);
--wi-shadow-hover:0 .35rem 1rem rgba(0,0,0,.10);
}
html[data-accent="azure"]{--wi-primary:#0e8bd4}
html[data-accent="indigo"]{--wi-primary:#4263eb}
html[data-accent="purple"]{--wi-primary:#6d28d9}
html[data-accent="cyan"]{--wi-primary:#0c9aa6}
html[data-accent="teal"]{--wi-primary:#0ca678}
[data-bs-theme="light"] body{background:#f1f4f9;color-scheme:light}
[data-bs-theme="dark"] body{color-scheme:dark}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem}
.card{box-shadow:var(--wi-shadow)}
.card .v{font-size:1.6rem;font-weight:700}
.empty{padding:1.8rem 1.2rem;text-align:center;color:var(--wi-muted)}
.empty h3{margin-bottom:.35rem}
.status{font-size:.72rem;padding:.15rem .6rem;border-radius:99px;background:var(--wi-border);white-space:nowrap}
.ok{background:#0f3d26;color:#fff}.err{background:#4a1620;color:#fff}.warn{background:#4a3416;color:#fff}
[data-bs-theme="light"] .ok{background:#dff3e3;color:#0f5132}[data-bs-theme="light"] .err{background:#fbe4e4;color:#a11919}[data-bs-theme="light"] .warn{background:#fbf0d9;color:#8a5a00}
/* ---- visual system: KPI icon blocks, hero, severity accents, timeline, cards ---- */
.kpi-ic{width:2.75rem;height:2.75rem;border-radius:.65rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.kpi-ic svg{width:1.4rem;height:1.4rem}
.kpi-card{transition:transform .12s ease,box-shadow .12s ease}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--wi-shadow-hover)}
.kpi-card .v a{color:inherit;text-decoration:none}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(32,107,196,.12),rgba(109,40,217,.10) 55%,transparent 80%)}
[data-bs-theme="dark"] .hero{background:linear-gradient(120deg,rgba(32,107,196,.24),rgba(109,40,217,.16) 55%,transparent 85%)}
.hero-visual{position:absolute;inset-inline-end:-10px;top:0;bottom:0;width:46%;opacity:.5;pointer-events:none}
[data-bs-theme="dark"] .hero-visual{opacity:.65}
@media(max-width:767px){.hero-visual{display:none}}
#gsearch{transition:box-shadow .12s ease,border-color .12s ease}
#gsearch:focus{border-color:var(--wi-primary);box-shadow:0 0 0 .22rem rgba(32,107,196,.16)}
.search-hero{font-size:1rem;padding:.65rem 1rem;border-radius:.65rem}
.sev{border-inline-start:3px solid transparent;border-radius:.25rem}

.sev-medium{border-inline-start-color:var(--tblr-yellow)}.sev-low{border-inline-start-color:var(--tblr-green)}
.sev-info{border-inline-start-color:var(--tblr-cyan)}
.table-hover tbody tr{transition:background .1s ease}
.tl{position:relative;padding-inline-start:1.4rem}
.tl::before{content:"";position:absolute;inset-inline-start:.34rem;top:.6rem;bottom:.2rem;width:2px;background:var(--wi-border)}
.tl-ev{position:relative;padding-bottom:.7rem}
.tl-dot{position:absolute;inset-inline-start:-1.4rem;top:.15rem;width:.8rem;height:.8rem;border-radius:50%;border:2px solid var(--wi-surface);box-shadow:0 0 0 1px var(--wi-border)}
.dot-blue{background:var(--tblr-blue)}.dot-cyan{background:var(--tblr-cyan)}.dot-purple{background:var(--tblr-purple)}
.dot-orange{background:var(--tblr-orange)}.dot-red{background:var(--tblr-red)}.dot-green{background:var(--tblr-green)}

.lift{transition:transform .12s ease,box-shadow .12s ease}

.risk-num{font-size:2.6rem;font-weight:800;line-height:1}

.login-bg{background:linear-gradient(135deg,#162c5b 0%,#206bc4 48%,#6d28d9 100%);border-radius:.75rem}

.type-ic{width:2rem;height:2rem;border-radius:.5rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.type-ic svg{width:1.1rem;height:1.1rem}
